name: conventions

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install
      - run: bun run check:app:types
      - run: bun run check:app:images
      - run: bun run check:app:components
