name: quality

on:
  pull_request:
  push:
    branches: [develop, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun run lint:check
      - run: bun run format:check
      - run: bun run type-check
