      authentique, idéal pour des projets résidentiels.
  - id: 019f32db-e430-7de0-ad9d-c83ab183f490
    codeValue: medina
    name: Médina
    inCodeSet: accommodation-place
    text: Construite à la fin du XVIIIe siècle, la Médina est le cœur historique
      d’Essaouira, animée par ses souks, ses remparts et son port. Classée au
      patrimoine mondial de l’UNESCO, elle séduit par son authenticité et son
      architecture unique.
  - id: 019f32db-e441-7c54-ae0b-c512e7513b65
