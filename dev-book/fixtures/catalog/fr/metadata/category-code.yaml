  - id: 019f32db-e433-7e4e-a446-7b36463ca6c4
    codeValue: campagne
    name: Campagne
    inCodeSet: accommodation-place
    text: Environnement calme autour d’Essaouira, idéal pour profiter d’espaces
      naturels, de tranquillité et de propriétés avec terrain.
  - id: 019f32db-e444-7042-8887-ea66f65a7ce3
    codeValue: chicht
    name: Chicht
    inCodeSet: accommodation-place
    text: Village situé dans la région d’Essaouira, proposant un environnement
      paisible et typique de la campagne marocaine.
  - id: 019f32db-e434-7ecd-b82f-e0c5faa18cdd
    codeValue: diabet
    name: Diabet
    inCodeSet: accommodation-place
    text: Situé à l’ouest d’Essaouira, Diabat est un village emblématique connu pour
      ses dunes, son ambiance bohème et sa proximité immédiate avec la plage.
      Très prisé pour les résidences secondaires et les maisons de charme, le
      secteur bénéficie également de la présence du golf de Mogador à proximité.
      Diabat séduit par son atmosphère paisible, son authenticité et son cadre
      naturel unique entre océan et désert.
  - id: 019f32db-e436-7abb-9bdd-876ff1a61aea
    codeValue: douar-larab
    name: Douar Laarab
    inCodeSet: accommodation-place
    text: Douar situé dans l’arrière-pays d’Essaouira, offrant un cadre authentique
      et rural, apprécié pour son calme et ses espaces naturels.
  - id: 019f32db-e435-7d0f-b3ee-a7a93c1ab603
    codeValue: ghazoua
    name: Ghazoua
    inCodeSet: accommodation-place
    text: Située à quelques minutes d’Essaouira, Ghazoua est une zone résidentielle
      en plein développement, très recherchée pour ses villas avec jardin et
      piscine. Le secteur offre un bon compromis entre calme, accessibilité et
      proximité des commodités. On y trouve de nombreuses propriétés modernes
      ainsi que des maisons d’hôtes, dans un environnement paisible à seulement
      quelques minutes du centre-ville et des plages.
  - id: 019f32db-e432-7eb1-b6f1-f8df5022ef9b
    codeValue: golf-mogador
    name: Mogador
    inCodeSet: accommodation-place
    text: Situé à proximité de Diabat, le golf de Mogador est un domaine réputé
      offrant un cadre sécurisé avec villas haut de gamme, entre océan et
      nature.
  - id: 019f32db-e43f-720b-9a8e-6e20104278eb
    codeValue: had-draa
    name: Had Draa
    inCodeSet: accommodation-place
    text: Localité rurale proche d’Essaouira, connue pour son ambiance
      traditionnelle et ses marchés locaux.
  - id: 019f32db-e43a-7b20-b4af-0671e852a533
