rules:
  - name: app-types-placement
    requiresManualReview: false
    severity: error
    description: 'Un type TypeScript manuel partage doit etre defini dans shared/types/ ; les contrats generes restent dans schemas/.'
    sharedTypesDir: shared/types
    generatedTypesDirs:
      - schemas/interfaces
      - schemas/dtos
    aliases:
      '~/': app
      '@/': app
      '#shared/': shared
      '@schemas/': schemas
      '@services/': services

  - name: app-script-setup-standard
    requiresManualReview: false
    severity: error
    description: 'Les fichiers Vue app doivent suivre les sections script setup dans l ordre attendu.'
    sectionCount: 12
    sectionPattern: "^\\s*\\/\\/\\s*(\\d+)\\.\\s"

  - name: app-images-use-app-image
    requiresManualReview: false
    severity: error
    description: 'Toute image affichee dans app passe par AppImage avec un preset.'
    allowedFiles:
      - app/components/AppImage.vue
    forbiddenTags:
      - img
      - NuxtImg
      - NuxtPicture
    inlineImageProps:
      - ':width='
      - ':format='
      - ':quality='
      - ':fit='
      - ':sizes='

  - name: app-images-no-height-prop
    requiresManualReview: false
    severity: error
    description: 'Les images dans app ne doivent pas declarer de prop height dans le template.'
    forbiddenProps:
      - height

  - name: app-no-fetch-in-components
    requiresManualReview: true
    severity: warning
    description: 'Les composants app/components/ ne doivent pas appeler $fetch ou useFetch directement.'
    patterns:
      - '$fetch('
      - 'useFetch('
      - 'useLazyFetch('

  - name: app-no-store-write-in-components
    requiresManualReview: true
    severity: warning
    description: 'Les composants app/components/ ne doivent pas ecrire directement dans un store.'
    patterns:
      - '.$patch('

  - name: app-no-commented-code
    requiresManualReview: true
    severity: warning
    description: 'Detecte les lignes de code commentees dans toute la base de code.'
    patterns:
      - '// const '
      - '// function '
      - '// return '
      - '// if ('
      - '// for ('
      - '// while ('
      - '// let '
      - '// var '
      - '// type '
      - '// interface '

  - name: app-no-nested-ternary
    requiresManualReview: false
    severity: error
    description: 'Detecte les ternaires imbriques dans toute la base de code.'

  - name: app-deep-nesting
    requiresManualReview: true
    severity: warning
    description: "Detecte plus de 3 niveaux d'imbrication dans toute la base de code."
    maxNestingDepth: 4
    indentSize: 2
    controlFlowKeywords:
      - 'if ('
      - 'for ('
      - 'while ('
      - 'switch ('
      - 'else {'
      - '} else'

  - name: app-todo-fixme
    requiresManualReview: true
    severity: warning
    description: 'Detecte les commentaires TODO, FIXME, HACK, XXX dans toute la base de code.'
    markers:
      - TODO
      - FIXME
      - HACK
      - XXX

  - name: app-large-component
    requiresManualReview: true
    severity: warning
    description: 'Detecte les composants Vue app/components/ depassant le seuil de lignes.'
    maxLines: 200

  - name: app-large-type
    requiresManualReview: true
    severity: warning
    description: 'Detecte les interfaces et types avec plus de 8 champs dans toute la base de code.'
    maxFields: 8

  - name: app-composable-many-returns
    requiresManualReview: true
    severity: warning
    description: 'Detecte les composables qui exposent plus de 8 valeurs dans leur return.'
    maxReturns: 8

  - name: app-components-no-business-logic
    requiresManualReview: true
    severity: warning
    description: 'Detecte les computed suspects qui combinent source globale et transformation de donnees.'
    globalSourcePattern: "^use\\w+Store$|^useAppConfig$"
    globalSourceFunctions:
      - storeToRefs
    transforms:
      - '.map('
      - '.filter('
      - '.reduce('
      - '.push('

  - name: app-no-redundant-guards
    requiresManualReview: true
    severity: warning
    description: 'Detecte les gardes defensives residuelles sur des variables dont le contrat de type est suffisant.'
    patterns:
      - '?? undefined'
      - '?? null'
    templateDoubleCheckRegex: '\b(\w+)\s+&&\s+\1\.'
