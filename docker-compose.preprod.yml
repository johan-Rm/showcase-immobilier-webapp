services:
  content-sync:
    image: oven/bun:1-alpine
    working_dir: /app
    env_file:
      - .env.preprod
    volumes:
      - ./:/app
      - ${SCHEMAS_PATH:-../../schemas}:/opt/app-schemas
    environment:
      NODE_ENV: production
      SCHEMAS_PATH: /opt/app-schemas
    command: sh -c "bun install --frozen-lockfile && bun scripts/content-sync.ts"
    networks:
      app_stack: {}

  webapp-ssr:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        schemas: ${SCHEMAS_PATH:-../../schemas}
      args:
        APP_ENV: ${APP_ENV:-production}
        SITE_URL: ${SITE_URL:?SITE_URL is required — set it in .env.preprod}
        SITE_NAME: ${SITE_NAME:?SITE_NAME is required — set it in .env.preprod}
    working_dir: /app
    init: true
    env_file:
      - .env.preprod
    environment:
      NODE_ENV: production
      SCHEMAS_PATH: /opt/app-schemas
      NUXT_RESEND_API_KEY: ${RESEND_API_KEY:-}
      NUXT_RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      NUXT_CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      NUXT_CONTACT_BCC_EMAILS: ${CONTACT_BCC_EMAILS:-}
      NUXT_CONTACT_REPLY_TO_EMAIL: ${CONTACT_REPLY_TO_EMAIL:-}
      NUXT_CONTACT_SUBMISSIONS_PATH: ${CONTACT_SUBMISSIONS_PATH:-.data/contact-submissions.csv}
      SYMFONY_API_URL: ${SYMFONY_API_URL:-}
      NUXT_SYMFONY_API_URL: ${SYMFONY_API_URL:-}
      NUXT_SYMFONY_API_DOCS_URL: ${SYMFONY_API_DOCS_URL:-}
      NUXT_SYMFONY_PROJECT_ID: ${SYMFONY_PROJECT_ID:-}
      NUXT_SYMFONY_SERVICE_EMAIL: ${SYMFONY_SERVICE_EMAIL:-}
      NUXT_SYMFONY_SERVICE_PASSWORD: ${SYMFONY_SERVICE_PASSWORD:-}
    expose:
      - '3000'
    volumes:
      - ${SCHEMAS_PATH:-../../schemas}:/opt/app-schemas
      - ./public/images:/app/.output/public/images
    networks:
      app_stack: {}
      edge_network:
        aliases:
          - ${EDGE_ALIAS:?EDGE_ALIAS is required — set it in .env.preprod}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

networks:
  app_stack:
    name: ${APP_STACK_NETWORK_NAME:?APP_STACK_NETWORK_NAME is required — set it in .env.preprod}
    driver: bridge
  edge_network:
    external: true
    name: edge-net
