    type: string
  id:
    type: uuid
  name:
    type: string
  body:
    type: string
  category:
    type: uuid
  offer:
    type: object
    properties:
      price:
        type: string
      priceCurrency:
        type: string
      priceSpecification:
        type: string
      availability:
        type: string
  yearBuilt:
    type: number
  place:
    type: uuid
  floorSize:
    type: string
  numberOfRooms:
    type: number
  landArea:
    type: string
  numberOfGarages:
    type: number
  numberOfBedrooms:
    type: number
  numberOfBathroomsTotal:
    type: number
  level:
    type: number
  occupancy:
    type: number
  amenityFeature:
