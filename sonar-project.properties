sonar.projectName=showcase-immobilier-webapp
sonar.sourceEncoding=UTF-8

sonar.sources=app,server,services,shared,schemas,scripts,docs
sonar.tests=scripts
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

sonar.exclusions=\
  .nuxt/**,\
  .output/**,\
  .tmp/**,\
  coverage/**,\
  dist/**,\
  node_modules/**,\
  schemas/interfaces/**,\
  dev-book/specs[deprecated]/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
