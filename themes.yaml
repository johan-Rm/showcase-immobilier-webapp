# Responsabilite des couleurs (tokens)
#
# background : fond principal de l'interface
# surface : surfaces elevees (cartes, panneaux)
# foreground : texte principal (contenu par defaut)
# primary : action principale (boutons, liens, accents)
# secondary : action secondaire (accents secondaires)
# border : contours et separations
# ring : focus/etat actif (anneau d'accessibilite)
#
